<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Browser - Sicheres Browsen im Intranet</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        .container {
            width: 100%;
            height: 100vh;
            display: flex;
        }

        /* LOGIN SCREEN */
        .login-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .login-screen.active {
            display: flex;
        }

        .login-box {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
        }

        .login-box h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #667eea;
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn:hover {
            background: #5568d3;
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .error {
            color: #d32f2f;
            margin-top: 10px;
            font-size: 14px;
            text-align: center;
        }

        .success {
            color: #388e3c;
            margin-top: 10px;
            font-size: 14px;
            text-align: center;
        }

        .tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 2px solid #ddd;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            background: none;
            border: none;
            cursor: pointer;
            font-weight: 600;
            color: #999;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .tab-btn.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* BROWSER SCREEN */
        .browser-screen {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
        }

        .browser-screen.active {
            display: flex;
        }

        .toolbar {
            background: #f5f5f5;
            border-bottom: 1px solid #ddd;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .toolbar button {
            padding: 8px 16px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        .toolbar button:hover {
            background: #efefef;
        }

        .user-info {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }

        .user-info span {
            color: #666;
        }

        .vnc-container {
            flex: 1;
            position: relative;
            background: #000;
            overflow: hidden;
        }

        #noVNC_canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .spinner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            text-align: center;
        }

        .status {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 12px;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        .modal-content h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .modal-buttons button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-cancel {
            background: #ddd;
            color: #333;
        }

        .btn-confirm {
            background: #d32f2f;
            color: white;
        }
    </style>
</head>
<body>
    <!-- LOGIN SCREEN -->
    <div class="login-screen active" id="loginScreen">
        <div class="login-box">
            <h1>🌐 Virtual Browser</h1>
            
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('login')">Login</button>
                <button class="tab-btn" onclick="switchTab('register')">Registrieren</button>
            </div>

            <!-- LOGIN TAB -->
            <div class="tab-content active" id="loginTab">
                <div class="form-group">
                    <label>Benutzername</label>
                    <input type="text" id="loginUsername" placeholder="Benutzername" />
                </div>
                <div class="form-group">
                    <label>Passwort</label>
                    <input type="password" id="loginPassword" placeholder="Passwort" />
                </div>
                <button class="btn" onclick="handleLogin()" id="loginBtn">Anmelden</button>
                <div id="loginError"></div>
            </div>

            <!-- REGISTER TAB -->
            <div class="tab-content" id="registerTab">
                <div class="form-group">
                    <label>Benutzername</label>
                    <input type="text" id="registerUsername" placeholder="Mindestens 3 Zeichen" />
                </div>
                <div class="form-group">
                    <label>Passwort</label>
                    <input type="password" id="registerPassword" placeholder="Mindestens 6 Zeichen" />
                </div>
                <button class="btn" onclick="handleRegister()" id="registerBtn">Registrieren</button>
                <div id="registerError"></div>
                <div id="registerSuccess"></div>
            </div>

            <p style="text-align: center; margin-top: 20px; font-size: 12px; color: #999;">
                Test: testuser / testpass
            </p>
        </div>
    </div>

    <!-- BROWSER SCREEN -->
    <div class="browser-screen" id="browserScreen">
        <div class="toolbar">
            <button onclick="fullscreenVNC()">⛶ Vollbild</button>
            <button onclick="openLogs()">📋 Logs</button>
            <div class="user-info">
                <span id="userDisplay"></span>
                <button onclick="confirmLogout()" style="background: #d32f2f; color: white;">Abmelden</button>
            </div>
        </div>
        
        <div class="vnc-container">
            <canvas id="noVNC_canvas"></canvas>
            <div class="spinner" id="spinner">
                <div>Verbindung wird aufgebaut...</div>
                <div style="font-size: 12px; margin-top: 10px;">Browser wird gestartet...</div>
            </div>
            <div class="status" id="status">Verbindung wird hergestellt</div>
        </div>
    </div>

    <!-- LOGOUT MODAL -->
    <div class="modal" id="logoutModal">
        <div class="modal-content">
            <h2>Abmelden bestätigen</h2>
            <p>Möchtest du dich wirklich abmelden? Der virtuelle Browser wird beendet.</p>
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeModal()">Abbrechen</button>
                <button class="btn-confirm" onclick="handleLogout()">Abmelden</button>
            </div>
        </div>
    </div>

    <!-- LOGS MODAL -->
    <div class="modal" id="logsModal">
        <div class="modal-content">
            <h2>📋 Browsing-Verlauf (heute)</h2>
            <div id="logsList" style="max-height: 400px; overflow-y: auto; margin-bottom: 20px;">
                <p style="text-align: center; color: #999;">Lade Logs...</p>
            </div>
            <div style="text-align: right;">
                <button class="btn-cancel" onclick="closeModal()">Schließen</button>
            </div>
        </div>
    </div>

    <script>
        let currentToken = null;
        let currentUser = null;
        const API_BASE = window.location.origin + '/api';

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tab + 'Tab').classList.add('active');
            event.target.classList.add('active');
        }

        function closeModal() {
            document.getElementById('logoutModal').classList.remove('active');
            document.getElementById('logsModal').classList.remove('active');
        }

        function confirmLogout() {
            document.getElementById('logoutModal').classList.add('active');
        }

        function fullscreenVNC() {
            const canvas = document.getElementById('noVNC_canvas');
            if (canvas.requestFullscreen) {
                canvas.requestFullscreen();
            }
        }

        async function handleRegister() {
            const username = document.getElementById('registerUsername').value;
            const password = document.getElementById('registerPassword').value;

            if (!username || !password) {
                document.getElementById('registerError').textContent = 'Benutzername und Passwort erforderlich';
                return;
            }

            try {
                const response = await fetch(API_BASE + '/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (response.ok) {
                    document.getElementById('registerSuccess').innerHTML = '<span style="color: #388e3c;">✓ Registrierung erfolgreich! Melde dich jetzt an.</span>';
                } else {
                    const error = await response.json();
                    document.getElementById('registerError').textContent = error.detail || 'Registrierung fehlgeschlagen';
                }
            } catch (error) {
                document.getElementById('registerError').textContent = 'Fehler: ' + error.message;
            }
        }

        async function handleLogin() {
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;

            if (!username || !password) {
                document.getElementById('loginError').textContent = 'Benutzername und Passwort erforderlich';
                return;
            }

            document.getElementById('loginBtn').disabled = true;
            document.getElementById('loginBtn').textContent = 'Wird angemeldet...';

            try {
                const response = await fetch(API_BASE + '/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (!response.ok) {
                    const error = await response.json();
                    document.getElementById('loginError').textContent = error.detail || 'Anmeldung fehlgeschlagen';
                    document.getElementById('loginBtn').disabled = false;
                    document.getElementById('loginBtn').textContent = 'Anmelden';
                    return;
                }

                const data = await response.json();
                currentToken = data.token;
                currentUser = username;

                document.getElementById('userDisplay').textContent = '👤 ' + username;
                document.getElementById('loginScreen').classList.remove('active');
                document.getElementById('browserScreen').classList.add('active');

                // Connect to VNC iframe
                setTimeout(() => {
                    const vncUrl = data.vnc_url;
                    const canvas = document.getElementById('noVNC_canvas');
                    const iframe = document.createElement('iframe');
                    iframe.src = vncUrl;
                    iframe.style.width = '100%';
                    iframe.style.height = '100%';
                    iframe.style.border = 'none';
                    canvas.parentElement.replaceChild(iframe, canvas);
                    document.getElementById('spinner').style.display = 'none';
                }, 1000);

            } catch (error) {
                document.getElementById('loginError').textContent = 'Fehler: ' + error.message;
                document.getElementById('loginBtn').disabled = false;
                document.getElementById('loginBtn').textContent = 'Anmelden';
            }
        }

        async function handleLogout() {
            try {
                await fetch(API_BASE + '/logout?token=' + currentToken, { method: 'POST' });
                
                currentToken = null;
                currentUser = null;
                
                document.getElementById('browserScreen').classList.remove('active');
                document.getElementById('loginScreen').classList.add('active');
                closeModal();
                
                document.getElementById('loginUsername').value = '';
                document.getElementById('loginPassword').value = '';
            } catch (error) {
                console.error('Logout error:', error);
            }
        }

        async function openLogs() {
            try {
                const response = await fetch(API_BASE + '/user?token=' + currentToken);
                const userData = await response.json();
                
                const logsResponse = await fetch(
                    API_BASE + '/logs/' + userData.id + '?token=' + currentToken
                );
                const logsData = await logsResponse.json();
                
                if (logsData.logs.length === 0) {
                    document.getElementById('logsList').innerHTML = 
                        '<p style="text-align: center; color: #999;">Keine URLs aufgerufen</p>';
                } else {
                    const logsHtml = logsData.logs.map(log => 
                        '<div style="padding: 10px; border-bottom: 1px solid #ddd; font-size: 12px;">' +
                        '<strong>' + log.timestamp + '</strong><br>' +
                        '<code>' + log.url + '</code>' +
                        '</div>'
                    ).join('');
                    document.getElementById('logsList').innerHTML = logsHtml;
                }
                
                document.getElementById('logsModal').classList.add('active');
            } catch (error) {
                alert('Fehler beim Laden der Logs: ' + error.message);
            }
        }

        document.getElementById('loginPassword').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleLogin();
        });
    </script>
</body>
</html>
