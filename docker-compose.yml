version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: vbrowser-backend
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - HOST_IP=${HOST_IP:-localhost}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - DB_PATH=./data/browser.db
      - LOG_DIR=./data/logs
      - DOCKER_IMAGE=virtual-browser:latest
    volumes:
      - ./data:/app/data
      - ./frontend:/app/frontend
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - vbrowser-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: vbrowser-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    networks:
      - vbrowser-net
    restart: unless-stopped

networks:
  vbrowser-net:
    driver: bridge
