version: '3.8'

networks:
  proxy:
    driver: bridge
    name: vbrowser_proxy

services:
  traefik:
    image: traefik:2.11
    container_name: vbrowser-traefik
    restart: unless-stopped
    command:
      - --api.dashboard=true
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=proxy
      - --entrypoints.web.address=:80
      - --providers.file.directory=/etc/traefik/dynamic
    ports:
      - "80:80"          # nur HTTP, HTTPS macht ipv64-CDN
      - "8888:8080"      # Dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik-dynamic.yml:/etc/traefik/dynamic/dynamic.yml:ro
    networks:
      - proxy

  backend:
    build: .
    container_name: vbrowser-backend
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./backend.py:/app/backend.py
      - ./.data:/appdata
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - proxy
    labels:
      - traefik.enable=true

      # Haupt-Router (HTTP, extern aber über ipv64 schon HTTPS terminiert)
      - traefik.http.routers.vbrowser-backend.rule=Host(`sirus.ipv64.de`)
      - traefik.http.routers.vbrowser-backend.entrypoints=web
      - traefik.http.services.vbrowser-backend.loadbalancer.server.port=8080

      # HTTP → HTTPS Redirect brauchst du jetzt nicht mehr in Traefik,
      # das macht das ipv64-CDN (Browser kommt ohnehin per https rein)

      # Auth-Router (gleicher Service, andere Rule)
      - traefik.http.routers.vbrowser-auth.rule=HostRegexp(`{subdomain:[a-z0-9-]+}.sirus.ipv64.de`) && Path(`/auth/set-cookie`)
      - traefik.http.routers.vbrowser-auth.entrypoints=web
      - traefik.http.routers.vbrowser-auth.service=vbrowser-backend
      - traefik.http.routers.vbrowser-auth.priority=10
