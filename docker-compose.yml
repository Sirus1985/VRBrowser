version: '3.8'

networks:
  proxy:
    driver: bridge
    name: vbrowser_proxy

services:
  traefik:
    image: traefik:2.11
    container_name: vbrowser-traefik
    restart: unless-stopped
    command:
      - --api.dashboard=true
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=proxy
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443        # ← NEU: HTTPS EntryPoint
      - --providers.file.directory=/etc/traefik/dynamic
    ports:
      - "80:80"
      - "443:443"                                    # ← NEU
      - "8888:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik-dynamic.yml:/etc/traefik/dynamic/dynamic.yml:ro
      - ./certs:/etc/traefik/certs:ro               # ← NEU: Zertifikate einbinden
    networks:
      - proxy

  backend:
    build: .
    container_name: vbrowser-backend
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./backend.py:/app/backend.py
      - ./.data:/appdata
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - proxy
    labels:
      - traefik.enable=true
      # HTTP → HTTPS Redirect
      - traefik.http.routers.vbrowser-http.rule=Host(`vbrowser.home`)
      - traefik.http.routers.vbrowser-http.entrypoints=web
      - traefik.http.routers.vbrowser-http.middlewares=redirect-https@file
      # HTTPS Router (Hauptrouter)
      - traefik.http.routers.vbrowser-backend.rule=Host(`vbrowser.home`)
      - traefik.http.routers.vbrowser-backend.entrypoints=websecure
      - traefik.http.routers.vbrowser-backend.tls=true
      - traefik.http.services.vbrowser-backend.loadbalancer.server.port=8080
      # Auth-Router ebenfalls auf HTTPS
      - traefik.http.routers.vbrowser-auth.rule=HostRegexp(`{subdomain:[a-z0-9-]+}.vbrowser.home`) && Path(`/auth/set-cookie`)
      - traefik.http.routers.vbrowser-auth.entrypoints=websecure
      - traefik.http.routers.vbrowser-auth.tls=true
      - traefik.http.routers.vbrowser-auth.service=vbrowser-backend
      - traefik.http.routers.vbrowser-auth.priority=10
